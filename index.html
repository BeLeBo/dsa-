<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Heldenbogen und Würfel für Das Schwarze Auge 5 – am Handy und am Spieltisch." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DSA5" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>DSA5 am Spieltisch</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
      // Gewählte Darstellung vor dem ersten Zeichnen setzen (verhindert kurzes Aufblitzen).
      try {
        const theme = JSON.parse(localStorage.getItem('dsa5.ui.theme'));
        const textSize = JSON.parse(localStorage.getItem('dsa5.ui.schrift'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        if (textSize === 'gross' || textSize === 'sehr-gross') document.documentElement.dataset.text = textSize;
      } catch {
        // Kein Zugriff auf localStorage: Systemeinstellung verwenden.
      }
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <p class="loading">Lade Heldenbogen …</p>
    </div>
    <noscript>
      <p class="loading">Diese App braucht JavaScript. Bitte aktiviere es in deinem Browser.</p>
    </noscript>
    <script>
      // Falls die App nicht startet (als Datei geöffnet, eine Datei blockiert, sehr alter Browser):
      // Hinweis statt leerer Seite – sofort, wenn eine Datei nicht geladen werden konnte, sonst nach 8 s.
      (() => {
        const showHint = () => {
          if (!document.querySelector('#app > .loading')) return; // App hat bereits etwas angezeigt
          const hint =
            location.protocol === 'file:'
              ? 'Bitte die App über einen Webserver oder GitHub Pages öffnen – als lokale Datei funktioniert sie nicht.'
              : 'Die App konnte nicht geladen werden. Ist ein Werbe- oder Tracker-Blocker aktiv (z. B. in Opera GX, Brave oder als Erweiterung)? Dann diese Seite dort als Ausnahme eintragen. Sonst die Seite neu laden oder einen aktuellen Browser verwenden.';
          document
            .getElementById('app')
            .replaceChildren(Object.assign(document.createElement('p'), { className: 'loading', textContent: hint }));
        };
        document.querySelector('script[type="module"]').addEventListener('error', showHint);
        setTimeout(showHint, 8000);
      })();
    </script>
  </body>
</html>
